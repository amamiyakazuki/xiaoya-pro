<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小雅任务</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="panel" aria-label="任务面板">
    <header class="head">
      <span class="logo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5 6.3 12 13 4.5"/></svg></span>
      <div class="title"><strong>小雅任务</strong><span id="sync" aria-live="polite"></span></div>
      <button class="icon" id="searchBtn" aria-label="搜索" title="搜索" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></button>
      <button class="icon" id="fold" aria-label="全部收起" title="全部收起"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 6.5 3.5-3 3.5 3M4.5 9.5l3.5 3 3.5-3"/></svg></button>
      <button class="icon" id="refresh" aria-label="刷新任务" title="刷新"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2v3h-3"/></svg></button>
      <button class="icon" id="gear" aria-label="打开设置" title="设置"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 4.5h6M12 4.5h2M2 11.5h2M8 11.5h6"/><circle cx="10" cy="4.5" r="1.8"/><circle cx="6" cy="11.5" r="1.8"/></svg></button>
    </header>

    <button class="brief" id="brief" aria-expanded="false"></button>
    <div class="weekwrap" id="weekwrap"><section class="week" id="week" aria-label="未来 7 天"></section></div>

    <div class="controls">
      <div class="seg" role="tablist" id="tabs"></div>
      <label class="search" id="searchBox" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="search" type="search" placeholder="搜索课程或任务" aria-label="搜索课程或任务"></label>
      <div class="chips" id="chips"></div>
    </div>

    <div class="scroller" id="scroller">
      <div class="notice" id="notice" hidden></div>
      <div class="list" id="list"></div>
    </div>

    <section class="sheet" id="sheet" aria-label="设置">
      <div class="sheet-head"><h3>设置</h3><button class="icon" id="closeSheet" aria-label="关闭设置"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
      <div class="sheet-body">
        <div class="sect"><span>默认排列</span><div class="seg" id="view"></div></div>
      </div>
    </section>
  </main>
  <script src="task-data.js"></script>
  <script src="panel-model.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
